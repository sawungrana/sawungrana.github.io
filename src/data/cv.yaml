# The single source of truth for the CV.
# Everything on /cv, /cv/print, /cv/plain, cv.pdf and cv-plain.pdf is generated
# from this file, and validated by src/lib/cv.ts at build time.
#
# House rule: quote any string that contains a colon, a leading dash, or a bare
# year. Unquoted, "Lead the data function: platform" becomes a YAML mapping and
# the build fails.

person:
  # Shown everywhere. The full name is kept only for structured data, so that
  # someone searching the old name still lands here.
  name: Azza Sawungrana
  displayName: Azza Sawungrana
  legalName: Azzadiva Ravi Sawungrana
  headline: Head of Data at Geosquare
  positioning: National datasets, the standards around them, and what they cost to serve.
  location: Klaten, Indonesia
  email: azzadv@outlook.com
  links:
    - label: lantip.space
      href: https://lantip.space
    - label: github
      href: https://github.com/sawungrana
    - label: linkedin
      href: https://www.linkedin.com/in/sawungrana
    - label: scholar
      href: https://scholar.google.com/citations?user=wjm9qZMAAAAJ
  summary:
    - >-
      Head of Data at Geosquare, where national datasets become location
      intelligence for land, hazard, property and mobility decisions. I own the
      platform architecture, the standards the team works to, and what it costs
      to run.
    - >-
      The thread through Bhumi Varta and Geosquare has been the same one: taking
      delivery that was built for one client and making it work for the next. My
      work sits where data engineering meets product judgement, and I care about
      the cost of serving the second client, not only the quality of the first
      map.

